<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إهداء خاص لـ DONYA 💖</title>
    <style>
        :root { --accent: #ff2e63; --glow: #00d1ff; --bg: #fff0f5; } 
        
        body { 
            background-color: var(--bg); 
            color: #444; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; padding: 0; 
            min-height: 100vh; 
            overflow-x: hidden; 
            display: flex; flex-direction: column; align-items: center; 
        }
        
        /* القلوب المتساقطة */
        .heart { position: fixed; color: var(--accent); font-size: 15px; pointer-events: none; animation: fall linear forwards; z-index: 1; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); opacity: 0; } }

        /* شاشة البداية بصورة images.jpg */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255,192,203,0.3), rgba(255,192,203,0.3)), url('images.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2000; text-align: center; padding: 20px; transition: 0.8s;
        }
        .welcome-btn { background: var(--accent); color: white; border: none; padding: 15px 45px; border-radius: 50px; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: 0 0 25px var(--accent); }

        /* حاوية المحتوى */
        .container { display: none; flex-direction: column; align-items: center; width: 100%; z-index: 10; padding-bottom: 80px; position: relative; }
        
        .main-card { 
            width: 90%; max-width: 400px; 
            background: rgba(255, 255, 255, 0.25); 
            border: 1px solid rgba(255, 46, 99, 0.15); 
            border-radius: 35px; padding: 20px; 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            text-align: center; margin: 15px 0; 
            box-shadow: 0 8px 32px rgba(255, 46, 99, 0.05);
        }

        /* العداد */
        .timer-container { display: flex; justify-content: space-around; margin: 20px 0; }
        .timer-box { background: rgba(255, 255, 255, 0.5); padding: 10px; border-radius: 15px; width: 65px; border: 1px solid var(--accent); }
        .timer-box span { display: block; font-size: 20px; font-weight: bold; color: var(--accent); }

        /* زر الموسيقى العائم */
        #music-control {
            position: fixed; bottom: 20px; right: 20px;
            width: 50px; height: 50px;
            background: var(--accent);
            border-radius: 50%;
            display: none; 
            align-items: center; justify-content: center;
            cursor: pointer; z-index: 4000;
            box-shadow: 0 4px 15px rgba(255, 46, 99, 0.4);
            font-size: 24px; color: white;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <!-- شاشة الترحيب والبداية -->
    <div id="welcome-screen">
        <h1 style="color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.5); font-size: 2.5rem; margin-bottom: 30px;">إهداء خاص لـ DONYA 💖</h1>
        <button class="welcome-btn" onclick="startExperience()">افتح الإهداء ✨</button>
    </div>

    <!-- حاوية المحتوى الرئيسي -->
    <div class="container" id="main-content">
        <div class="main-card">
            <h2 style="color: var(--accent); margin-top: 0;">كل لحظة وأنتِ بخير يا DONYA 🥰</h2>
            <p style="line-height: 1.6; font-size: 1.1rem;">تم تصميم هذه الصفحة خصيصاً للتعبير عن معزتك ومكانتك الغالية.</p>
            
            <hr style="border: 0; border-top: 1px solid rgba(255, 46, 99, 0.2); margin: 20px 0;">
            
            <!-- العداد الزمني التنازلي/التصاعدي -->
            <div class="timer-container">
                <div class="timer-box"><span id="days">00</span>أيام</div>
                <div class="timer-box"><span id="hours">00</span>ساعات</div>
                <div class="timer-box"><span id="minutes">00</span>دقائق</div>
                <div class="timer-box"><span id="seconds">00</span>ثواني</div>
            </div>
        </div>
    </div>

    <!-- زر التحكم بالموسيقى -->
    <div id="music-control" onclick="toggleMusic()">🎵</div>

    <!-- ملف الصوت الصامت كمثال (يمكنك تغيير الرابط برابط أغنيتك المفضلة) -->
    <audio id="bg-music" loop>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <script>
        // دالة بدء التجربة بعد الضغط على الزر
        function startExperience() {
            document.getElementById('welcome-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('welcome-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'flex';
                document.getElementById('music-control').style.display = 'flex';
                
                // تشغيل الموسيقى
                const music = document.getElementById('bg-music');
                music.play().catch(error => console.log("تحتاج الموسيقى لتفاعل المستخدم أولاً"));
                
                // بدء تأثير القلوب المتساقطة
                setInterval(createHeart, 300);
            }, 800);
        }

        // دالة إنشاء القلوب المتساقطة
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            heart.style.fontSize = Math.random() * 15 + 10 + 'px';
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        // دالة تشغيل وإيقاف الموسيقى
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('music-control');
            if (music.paused) {
                music.play();
                btn.innerHTML = '🎵';
            } else {
                music.pause();
                btn.innerHTML = '🔇';
            }
        }

        // نظام العداد (معد مسبقاً لزيادة الثواني كعداد وقت مستغرق، يمكنك تعديله لتاريخ محدد)
        let count = 0;
        setInterval(() => {
            count++;
            document.getElementById('seconds').innerText = String(count % 60).padStart(2, '0');
            document.getElementById('minutes').innerText = String(Math.floor(count / 60) % 60).padStart(2, '0');
            document.getElementById('hours').innerText = String(Math.floor(count / 3600) % 24).padStart(2, '0');
            document.getElementById('days').innerText = String(Math.floor(count / 86400)).padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
